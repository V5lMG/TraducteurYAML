# ==============================================================================
# Configuration d'exemple du plugin (Anglais source)
# ==============================================================================

# Paramètres généraux
plugin:
  enabled: true
  debug-mode: false
  max-members: 50
  daily-tax: 150.5
  prefix: '&6[&lKingdoms&6] &2'

# Identifiants techniques (ne doivent pas être traduits)
effects:
  join-sound: BLOCK_NOTE_BLOCK_BELL
  teleport-sound: ENTITY_EXPERIENCE_ORB_PICKUP

# Messages avec codes couleur, variables et placeholders
messages:
  welcome: '{$p}Bienvenue au royaume, {$s}%player%{$p}!'
  unclaimed-land: '{$e}Un total de {$es}%blocks% {$e}blocs ont été exclus puisqu''ils se trouvent sur des terres non réclamées.'
  view-logs: "{$e}Vous n'avez pas la permission d'afficher journaux d'audit."
  cannon-fire: '{$p}Le canon de siège est chargé et prêt à tirer à %target%!'
  warp-purchase: '{$p}Vous avez acheté un plaque de téléportation pour {$s}%cost% {$p}points de ressources.'
  outpost-warning: 'Vous ne pouvez pas placer un avant-poste dans un royaume ennemi.'

# Boutons et commandes interactives au survol
gui:
  invites: '{$p}Vous avez {$s}%invites% {$p}invite. Cliquez sur hover:{/k invites;&9Click to open;/k invites}'
  cancel-prompt: '{$s}Type hover:{/cancel;&cClick to cancel;/cancel} {$s}pour annuler l''action.'

# Annonces et blocs multilignes (préservés avec le pipe |)
announcements:
  daily-reminder: |
    &4&l&nAttention{$sep}: {$e}&lDes contrôles quotidiens des impôts seront effectués en {$sep}: {$es}%time%
    Si votre royaume n'a pas assez de fonds, il sera dissous.
